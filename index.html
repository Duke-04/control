<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control PID - Dos Tanques</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --panel: #161B22;
    --panel-border: #30363D;
    --accent-blue: #58A6FF;
    --accent-green: #3FB950;
    --accent-red: #F85149;
    --text-primary: #E6EDF3;
    --text-secondary: #8B949E;
    --btn-active: #238636;
    --btn-inactive: #21262D;
    --grid: rgba(88, 166, 255, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 20px;
    background-image: 
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; background: var(--panel); padding: 15px 25px;
    border-radius: 8px; border: 1px solid var(--panel-border);
  }

  .title h1 { color: var(--accent-blue); font-size: 24px; text-transform: uppercase; }
  .title p { color: var(--text-secondary); font-family: 'Share Tech Mono'; font-size: 12px; }

  .mqtt-status {
    display: flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono';
    font-size: 14px; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--panel-border);
  }
  .disconnected { color: var(--accent-red); border-color: var(--accent-red); }
  .connected { color: var(--accent-green); border-color: var(--accent-green); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .layout-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .panel-title { font-family: 'Share Tech Mono'; font-size: 12px; color: var(--text-secondary); margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--panel-border); padding-bottom: 5px; }

  .btn-group { display: flex; gap: 10px; }
  .btn { flex: 1; background: var(--btn-inactive); color: var(--text-primary); border: 1px solid var(--panel-border); padding: 8px; border-radius: 6px; cursor: pointer; font-family: 'Rajdhani'; font-weight: 700; text-transform: uppercase; transition: all 0.3s; }
  .btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .btn.active { background: var(--btn-active); border-color: var(--accent-green); }

  .slider-container { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
  .slider-container input[type="range"] { flex: 1; accent-color: var(--accent-blue); }
  .slider-value { font-family: 'Share Tech Mono'; color: var(--accent-blue); font-size: 18px; min-width: 45px; }

  .canvas-container { width: 100%; position: relative; }
  #plantCanvas { width: 100%; height: 260px; background: var(--bg); border-radius: 6px; border: 1px solid var(--panel-border); }
  
  .plot-canvas { width: 100%; height: 180px; display: block; }
</style>
</head>
<body>

  <div class="header">
    <div class="title">
      <h1>Control PID - Planta Dos Tanques</h1>
      <p>INTERFAZ WEB MQTT BASADA EN PyQt5</p>
    </div>
    <div id="mqttStatus" class="mqtt-status disconnected">
      <div class="dot"></div><span id="statusText">Desconectado</span>
    </div>
  </div>

  <div class="layout-grid">
    <div class="left-col">
      <div class="panel">
        <div class="panel-title">Generador de Señal (Referencia)</div>
        <div class="btn-group">
          <button class="btn active" id="btnSquare" onclick="setSignal('square')">Cuadrada</button>
          <button class="btn" id="btnRamp" onclick="setSignal('ramp')">Rampa</button>
          <button class="btn" id="btnSine" onclick="setSignal('sine')">Senoidal</button>
        </div>
        <div class="slider-container">
          <span class="panel-title" style="border:none; margin:0;">Setpoint (cm)</span>
          <input type="range" id="spSlider" min="10" max="80" value="40" oninput="updateSetpoint()">
          <span class="slider-value" id="spVal">4.00</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Planta (Diagrama QPainter -> Canvas)</div>
        <canvas id="plantCanvas" width="340" height="260"></canvas>
      </div>
    </div>

    <div class="right-col">
      <div class="panel" style="padding: 10px;">
        <div class="panel-title" style="margin:5px 10px;">Nivel (yk) vs Referencia (rk)</div>
        <div class="canvas-container"><canvas id="canvasPos" class="plot-canvas"></canvas></div>
      </div>
      <div class="panel" style="padding: 10px;">
        <div class="panel-title" style="margin:5px 10px;">Error de Control (ek)</div>
        <div class="canvas-container"><canvas id="canvasErr" class="plot-canvas"></canvas></div>
      </div>
      <div class="panel" style="padding: 10px;">
        <div class="panel-title" style="margin:5px 10px;">Esfuerzo de Control (uk)</div>
        <div class="canvas-container"><canvas id="canvasCtrl" class="plot-canvas"></canvas></div>
      </div>
    </div>
  </div>

<script>
// ==========================================
// LÓGICA MQTT (Del Segundo TXT)
// ==========================================
const brokerUrl = "wss://test.mosquitto.org:8081/mqtt"; // URL del Websocket MQTT
const topicData = "planta/tanques/datos";
const topicCmd  = "planta/tanques/cmd";
const client = mqtt.connect(brokerUrl);

client.on("connect", () => {
  document.getElementById("mqttStatus").className = "mqtt-status connected";
  document.getElementById("statusText").innerText = "Conectado";
  client.subscribe(topicData);
});
client.on("close", () => {
  document.getElementById("mqttStatus").className = "mqtt-status disconnected";
  document.getElementById("statusText").innerText = "Desconectado";
});

// Variables globales simulando ESP32/Simulador
let current_h1 = 0, current_h2 = 0;

client.on("message", (topic, message) => {
  if (topic === topicData) {
    // Replicando el parseo del CSV: rk,yk,ek,uk,h1,h2
    const parts = message.toString().split(',');
    if(parts.length >= 6){
      pushData(
        parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2]), 
        parseFloat(parts[3]), parseFloat(parts[4]), parseFloat(parts[5])
      );
    }
  }
});

function setSignal(type) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  if(type === 'square') document.getElementById('btnSquare').classList.add('active');
  if(type === 'ramp') document.getElementById('btnRamp').classList.add('active');
  if(type === 'sine') document.getElementById('btnSine').classList.add('active');
  client.publish(topicCmd, `signal,${type}`);
}

function updateSetpoint() {
  const val = (document.getElementById('spSlider').value / 10).toFixed(2);
  document.getElementById('spVal').innerText = val;
  client.publish(topicCmd, `setpoint,${val}`);
}

// ==========================================
// DIBUJO DE LA PLANTA (Idéntico a QPainter)
// ==========================================
function drawPlant() {
  const canvas = document.getElementById('plantCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  
  ctx.clearRect(0, 0, W, H);

  // Colores exactos del Python
  const col_tank    = "rgb(48, 54, 61)";
  const col_pipe    = "rgb(88, 166, 255)";
  const col_pump    = "rgba(63, 185, 80, 0.86)";
  const col_text    = "#E6EDF3";
  const col_sensor  = "rgb(188, 140, 255)";
  const col_valve   = "rgb(209, 153, 34)";
  const col_repo    = "rgb(22, 27, 34)";
  const border      = "#30363D";

  // Repositorio
  const repo_x = W * 0.35, repo_y = H * 0.75, repo_w = W * 0.30, repo_h = H * 0.18;
  ctx.fillStyle = col_repo; ctx.strokeStyle = border; ctx.lineWidth = 1.5;
  ctx.fillRect(repo_x, repo_y, repo_w, repo_h); ctx.strokeRect(repo_x, repo_y, repo_w, repo_h);
  // Agua Repositorio
  ctx.fillStyle = "rgba(31, 111, 235, 0.47)";
  ctx.fillRect(repo_x + 2, repo_y + repo_h/2, repo_w - 4, repo_h/2 - 2);
  
  ctx.fillStyle = col_text; ctx.font = "10px Consolas";
  ctx.fillText("Repositorio", repo_x, repo_y + repo_h + 14);

  // Bomba
  const pump_cx = repo_x - W * 0.12, pump_cy = repo_y + repo_h/2;
  ctx.fillStyle = "rgb(20, 50, 20)"; ctx.strokeStyle = col_pump; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(pump_cx, pump_cy, 12, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col_text; ctx.fillText("B", pump_cx - 3, pump_cy + 3);

  // Tanques (1 y 2)
  const drawTank = (tx, ty, tw, th, h_val, label) => {
    ctx.fillStyle = col_tank; ctx.strokeStyle = border; ctx.lineWidth = 1.5;
    ctx.fillRect(tx, ty, tw, th); ctx.strokeRect(tx, ty, tw, th);
    
    const fillH = th * (Math.min(8, Math.max(0, h_val)) / 8.0);
    if(fillH > 0) {
      let grad = ctx.createLinearGradient(tx, ty + th - fillH, tx, ty + th);
      grad.addColorStop(0, "rgba(58, 150, 255, 0.78)");
      grad.addColorStop(1, "rgba(20, 90, 200, 0.86)");
      ctx.fillStyle = grad;
      ctx.fillRect(tx + 2, ty + th - fillH, tw - 4, fillH - 1);
    }
    ctx.fillStyle = col_text;
    ctx.fillText(`${label}: ${h_val.toFixed(2)} cm`, tx + 4, ty - 5);

    // Sensor Ultrasónico
    ctx.strokeStyle = col_sensor; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx + tw/2 - 8, ty + 6); ctx.lineTo(tx + tw/2 + 8, ty + 6);
    ctx.moveTo(tx + tw/2, ty + 6); ctx.lineTo(tx + tw/2, ty + 14);
    ctx.stroke();
  };

  const t1_x = W*0.05, t1_y = H*0.12, t1_w = W*0.28, t1_h = H*0.52;
  const t2_x = W*0.62, t2_y = H*0.12, t2_w = W*0.28, t2_h = H*0.52;
  drawTank(t1_x, t1_y, t1_w, t1_h, current_h1, "T1");
  drawTank(t2_x, t2_y, t2_w, t2_h, current_h2, "T2");

  // Tuberías y Válvulas
  ctx.strokeStyle = col_pipe; ctx.lineWidth = 2;
  ctx.beginPath();
  
  // T1 a T2
  const conn_y = t1_y + t1_h - 8;
  ctx.moveTo(t1_x + t1_w, conn_y); ctx.lineTo(t2_x, conn_y);
  
  // T2 a Repo
  ctx.moveTo(t2_x + t2_w/2, t2_y + t2_h); ctx.lineTo(t2_x + t2_w/2, repo_y);
  ctx.moveTo(t2_x + t2_w/2, repo_y); ctx.lineTo(repo_x + repo_w/2, repo_y);
  
  // Repo a Bomba a T1
  ctx.moveTo(repo_x, repo_y + repo_h/2); ctx.lineTo(pump_cx + 12, pump_cy);
  ctx.moveTo(pump_cx - 12, pump_cy); ctx.lineTo(pump_cx - 12, t1_y + 4);
  ctx.moveTo(pump_cx - 12, t1_y + 4); ctx.lineTo(t1_x + t1_w/2, t1_y + 4);
  ctx.stroke();

  // Dibujar Válvula
  const drawValve = (vx, vy) => {
    ctx.fillStyle = col_valve; ctx.strokeStyle = col_valve; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(vx, vy - 6); ctx.lineTo(vx + 6, vy);
    ctx.lineTo(vx, vy + 6); ctx.lineTo(vx - 6, vy); ctx.closePath();
    ctx.fill(); ctx.stroke();
  };
  drawValve((t1_x + t1_w + t2_x) / 2, conn_y); // Válvula intermedia
  drawValve(t2_x + t2_w/2, t2_y + t2_h + (repo_y - t2_y - t2_h)/2); // Válvula salida T2
}

// ==========================================
// MOTOR DE GRÁFICAS Y SIMULACIÓN
// ==========================================
const MAX_POINTS = 300;
const buffers = {
  rk: new Array(MAX_POINTS).fill(0), yk: new Array(MAX_POINTS).fill(0),
  ek: new Array(MAX_POINTS).fill(0), uk: new Array(MAX_POINTS).fill(0)
};

const canvases = {
  pos: document.getElementById('canvasPos'),
  err: document.getElementById('canvasErr'),
  ctrl: document.getElementById('canvasCtrl')
};

function resize() {
  Object.values(canvases).forEach(c => { c.width = c.parentElement.clientWidth; c.height = c.parentElement.clientHeight; });
}
window.addEventListener('resize', resize); resize();

function pushData(rk, yk, ek, uk, h1, h2) {
  buffers.rk.push(rk); buffers.rk.shift();
  buffers.yk.push(yk); buffers.yk.shift();
  buffers.ek.push(ek); buffers.ek.shift();
  buffers.uk.push(uk); buffers.uk.shift();
  current_h1 = h1; current_h2 = h2;
}

function drawPlot(canvas, dataBuf, color, minV, maxV, refBuf = null) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Cuadrícula
  ctx.strokeStyle = 'rgba(88, 166, 255, 0.1)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<4; i++) { const y = (i/4)*H; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  const trace = (data, col, dash) => {
    ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = dash ? 1.5 : 2;
    ctx.setLineDash(dash ? [5, 5] : []);
    for (let i = 0; i < MAX_POINTS; i++) {
      const x = (i / (MAX_POINTS - 1)) * W;
      const y = H - ((Math.max(minV, Math.min(maxV, data[i])) - minV) / (maxV - minV)) * H;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.setLineDash([]);
  };

  if(refBuf) trace(refBuf, 'rgba(230,237,243,0.5)', true);
  trace(dataBuf, color, false);
}

function renderAll() {
  drawPlant(); // Dibuja la planta idéntica al QPainter
  drawPlot(canvases.pos, buffers.yk, '#58A6FF', 0, 8, buffers.rk);
  drawPlot(canvases.err, buffers.ek, '#F85149', -5, 5);
  drawPlot(canvases.ctrl, buffers.uk, '#3FB950', 0, 255);
  requestAnimationFrame(renderAll);
}
renderAll();

// Modo simulación visual si no hay MQTT
let sim_t = 0;
setInterval(() => {
  if (document.getElementById("mqttStatus").classList.contains("disconnected")) {
    sim_t += 0.1;
    const rk = document.getElementById('spSlider').value / 10;
    const yk = rk * 0.9 + (Math.sin(sim_t)*0.2); 
    const ek = rk - yk;
    const uk = Math.max(0, Math.min(255, 120 + (ek * 10)));
    pushData(rk, yk, ek, uk, yk, yk * 0.6); // Simulando h1 y h2
  }
}, 100);
</script>
</body>
</html>
